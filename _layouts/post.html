---
layout: default
---
{% include site-header.html %}
<main class="reading">
  <article>
    {% assign words = content | strip_html | number_of_words %}
    {% assign minutes = words | divided_by: 200.0 | ceil %}
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %b %Y" }}</time> · {{ minutes }} min</p>
    <h1 class="post-title">{{ page.title }}</h1>
    {{ content }}
  </article>
  {% include reading-footer.html %}
</main>
